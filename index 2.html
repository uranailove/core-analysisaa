<!DOCTYPE html><html lang="ja"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORE | 総合分析センター</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17263c;font:16px system-ui,sans-serif}header{background:white;border-bottom:1px solid #dce5ef;padding:20px}header b{font-size:25px;letter-spacing:5px;color:#2458a8}main{max-width:780px;margin:auto;padding:24px 16px}small{color:#64748b}h1{font-size:26px}h2{font-size:21px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile,section{background:white;border:1px solid #dce5ef;border-radius:14px;padding:20px}.tile{text-align:left;cursor:pointer;color:inherit;font:inherit}.tile strong{display:block;margin:12px 0}.tile:hover{border-color:#2458a8}button{cursor:pointer}button.answer,button.primary{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #dce5ef;background:white;border-radius:9px;font:inherit;color:inherit;text-align:left}button.primary{background:#2458a8;color:white;text-align:center}.bar{height:8px;background:#e4ebf5;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#3978ce;transition:width .3s}footer{text-align:center;color:#64748b;font-size:12px;padding:25px}.result{font-size:29px;color:#2458a8;font-weight:bold;margin:24px 0}.back{border:0;background:none;color:#2458a8;padding:10px 0}.muted{color:#64748b;line-height:1.7}</style><header><b>CORE</b><small>　総合分析センター</small></header><main id="app"><small>PERSONALITY &amp; POTENTIAL</small><h1>あなたの可能性を知る</h1><p class="muted">8種類の診断から選択してください。</p><div class="grid"><button class="tile" onclick="start(0)"><span style="font-size:26px;color:#2458a8">♡</span><strong>恋愛心理診断</strong><small>恋愛傾向・愛情表現<br>20問・約3分</small></button><button class="tile" onclick="start(1)"><span style="font-size:26px;color:#2458a8">◉</span><strong>精神年齢診断</strong><small>思考・判断傾向<br>20問・約3分</small></button><button class="tile" onclick="start(2)"><span style="font-size:26px;color:#2458a8">✧</span><strong>前世診断</strong><small>潜在的な性格傾向<br>20問・約3分</small></button><button class="tile" onclick="start(3)"><span style="font-size:26px;color:#2458a8">◇</span><strong>彼氏適性検査</strong><small>対人関係・協調性<br>20問・約3分</small></button><button class="tile" onclick="start(4)"><span style="font-size:26px;color:#2458a8">¥</span><strong>未来の年収診断</strong><small>行動傾向・将来性<br>20問・約3分</small></button><button class="tile" onclick="start(5)"><span style="font-size:26px;color:#2458a8">＋</span><strong>ゲーマー適性診断</strong><small>集中力・反応傾向<br>20問・約3分</small></button><button class="tile" onclick="start(6)"><span style="font-size:26px;color:#2458a8">∞</span><strong>結婚相手予測</strong><small>価値観・相性<br>20問・約3分</small></button><button class="tile" onclick="start(7)"><span style="font-size:26px;color:#2458a8">☆</span><strong>隠れた才能診断</strong><small>潜在能力・生活適性<br>20問・約3分</small></button></div></main><footer>CORE / エンターテインメント診断</footer><script>
const tests=[['恋愛心理診断','恋愛傾向・愛情表現','♡','彼女が大好きすぎるタイプ','愛情指数99%。素直に伝えるとさらに関係が良好になります。'],['精神年齢診断','思考・判断傾向','◉','精神年齢：3歳','甘えん坊指数98%。お昼寝と褒められることを好む傾向があります。'],['前世診断','潜在的な性格傾向','✧','彼女に飼われていたチワワ','今世でも飼い主への愛情が非常に強く残っています。'],['彼氏適性検査','対人関係・協調性','◇','彼氏適性：98%','改善項目：素直に謝る能力3%。ごめんねを覚えると満点です。'],['未来の年収診断','行動傾向・将来性','¥','推定年収：1億円','ただし将来の資産管理担当者は妻となる見込みです。'],['ゲーマー適性診断','集中力・反応傾向','＋','最適種目：皿洗い','ゲーム適性12%。皿洗い適性99%。キッチンで才能が開花します。'],['結婚相手予測','価値観・相性','∞','運命の相手：のどか','相性99.9%。すでに出会っている可能性が極めて高いです。'],['隠れた才能診断','潜在能力・生活適性','☆','専業主夫の才能','掃除98%、洗濯96%、皿洗い99%。今すぐ才能を活用しましょう。']];
const common=['予定のない休日は自由に過ごしたい','新しいことに挑戦するのが好きだ','物事を決めるとき直感を重視する','集中すると時間を忘れる','周囲の人の気持ちを考えることが多い','自分の考えを曲げない方だ','褒められるとやる気が出る','失敗してもすぐに切り替えられる','一人の時間も大切にしている','将来について考えることが多い','人に頼られるとうれしい','計画よりもその場の判断を優先する','好きなことには努力を惜しまない','変化に柔軟に対応できる','自分の感情を言葉にするのが得意だ','負けず嫌いな方だ','細かい作業も苦にならない','身近な人との時間を大切にする','自分にはまだ隠れた才能があると思う','直感的に相性が分かることがある'];
const specific=[['好きな人からの連絡は気になる','恋人には甘えたい'],['眠いときは機嫌が変わりやすい','好きなものには夢中になる'],['動物に親近感を覚える','初めての場所でも懐かしく感じる'],['意見が違っても相手の話を聞く','自分から謝ることができる'],['収入を増やす方法を考える','お金の管理が得意だ'],['ゲームで負けると悔しい','反復練習が得意だ'],['結婚生活を想像することがある','価値観の一致を重視する'],['家事は効率よく進めたい','手先を使う作業が好きだ']];
let current=0,q=0,answers=[],timer;const app=document.getElementById('app');function home(){clearInterval(timer);app.innerHTML='<small>PERSONALITY & POTENTIAL</small><h1>あなたの可能性を知る</h1><p class="muted">8種類の診断から、あなたの性格や潜在的な能力をチェックできます。</p><div class="grid">'+tests.map((t,i)=>`<button class="tile" onclick="start(${i})"><span style="font-size:26px;color:#2458a8">${t[2]}</span><strong>${t[0]}</strong><small>${t[1]}<br>20問・約3分</small></button>`).join('')+'</div>'}function start(i){current=i;q=0;answers=[];question()}function question(){let qs=[...specific[current],...common.slice(0,18)];app.innerHTML=`<button class="back" onclick="home()">‹ 診断一覧</button><section><small>${tests[current][0]}　${q+1} / 20</small><div class="bar"><i style="width:${q*5}%"></i></div><h2>${qs[q]}</h2>${['非常に当てはまる','やや当てはまる','どちらともいえない','あまり当てはまらない','全く当てはまらない'].map((a,i)=>`<button class="answer" onclick="next(${i})">${a}</button>`).join('')}${q?'<button class="back" onclick="q--;answers.pop();question()">‹ 前の質問</button>':''}</section>`}function next(i){answers.push(i);q++;q===20?loading():question()}function loading(){let p=0;app.innerHTML='<section><h2>回答を集計しています</h2><p id="status">回答データを整理中…</p><div class="bar"><i id="progress" style="width:0%"></i></div><small id="pct">0%</small></section>';timer=setInterval(()=>{p+=5;document.getElementById('progress').style.width=p+'%';document.getElementById('pct').textContent=p+'%';if(p===45)document.getElementById('status').textContent='傾向を照合中…';if(p===80)document.getElementById('status').textContent='診断レポートを生成中…';if(p>=100){clearInterval(timer);result()}},170)}function result(){let t=tests[current];app.innerHTML=`<section><small>ANALYSIS REPORT / ${t[0]}</small><h2>あなたの診断結果</h2><div class="result">${t[3]}</div><p class="muted">${t[4]}</p><button class="primary" onclick="home()">他の診断を受ける</button><button class="back" onclick="reveal()">診断の仕組みについて</button></section>`}function reveal(){app.innerHTML='<section><h1>ドッキリ大成功♡</h1><p>全部ドッキリ用の仕込みでした！</p><p>回答に関係なく結果が決まっているジョークサイトです。本物のAI・心理・知能診断ではありません。</p><button class="primary" onclick="home()">診断一覧へ</button></section>'}home();</script></html>
